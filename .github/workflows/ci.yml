name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar sintaxis HTML
        run: npx --yes html-validate@8 "*.html"

      - name: Chequear placeholders REPLACE en endpoints (bloqueante)
        run: |
          if grep -rn "REPLACE" --include="*.html" --include="*.js" --exclude-dir=node_modules .; then
            echo "::error::Hay placeholders REPLACE — un endpoint quedó sin configurar y los leads no se persistirían."
            exit 1
          fi
